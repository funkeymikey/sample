openapi: 3.0.3
info:
  title: Ledger API
  version: 0.1.0
  description: Accounts, transactions and bulk CSV imports.
paths:
  /api/accounts/:
    get:
      operationId: accounts_list
      description: Accounts with their current balances. Search by account number,
        name or email, filter by `status`, and sort with `ordering` (for example `-balance`).
      summary: List accounts
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CLOSED
          - OPEN
      tags:
      - Accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
    post:
      operationId: accounts_create
      description: New accounts always start OPEN, with a zero balance. Leave out
        `account_number` to have one generated.
      summary: Open an account
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request data is invalid.
  /api/accounts/{id}/:
    get:
      operationId: accounts_retrieve
      description: One account, with its current balance.
      summary: Get an account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this account.
        required: true
      tags:
      - Accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No object with this id.
    patch:
      operationId: accounts_partial_update
      description: 'Change an account''s name, email or status. Set `status` to CLOSED
        to close it: closing is final, and a closed account can''t be changed (400).
        `account_number` can''t be changed, and accounts are never deleted.'
      summary: Update an account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this account.
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request data is invalid.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No object with this id.
  /api/accounts/{id}/transactions/:
    get:
      operationId: accounts_transactions_list
      description: Newest first. Filter by `direction` and a `transaction_date` range.
      summary: List an account's transactions
      parameters:
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - CREDIT
          - DEBIT
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this transaction.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: transaction_date_after
        schema:
          type: string
          format: date
        description: Use `transaction_date_after` and/or `transaction_date_before`
          (inclusive).
      - in: query
        name: transaction_date_before
        schema:
          type: string
          format: date
        description: Use `transaction_date_after` and/or `transaction_date_before`
          (inclusive).
      tags:
      - Transactions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No object with this id.
    post:
      operationId: accounts_transactions_create
      description: Post a transaction to the account. Leave out `reference_id` to
        have one generated. A closed account is a 400; a duplicate `reference_id`
        is a 409.
      summary: Post a transaction
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this transaction.
        required: true
      tags:
      - Transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The account already has a transaction with this `reference_id`.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request data is invalid.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No object with this id.
  /api/health/:
    get:
      operationId: health_retrieve
      description: 'Runs a trivial query against the database. Intended for uptime
        checks and load balancers: anything other than a 200 means the API can''t
        serve requests. If the database is unreachable, the response is the standard
        500 error.'
      summary: Health check
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                Healthy:
                  value:
                    status: ok
          description: The API is up and the database is reachable.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
  /api/transactions/{id}/:
    get:
      operationId: transactions_retrieve
      description: Transactions can't be edited or deleted. To correct one, post a
        transaction for the same amount in the opposite direction.
      summary: Get a transaction
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this transaction.
        required: true
      tags:
      - Transactions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No object with this id.
components:
  schemas:
    Account:
      type: object
      description: An account as the API returns it, and the body for creating one.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        account_number:
          type: string
          description: Unique, and can't change after create. Generated (10 random
            digits) when left blank.
          maxLength: 32
        holder_name:
          type: string
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        status:
          allOf:
          - $ref: '#/components/schemas/AccountStatusEnum'
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          description: 'Credits minus debits: positive is money held, negative means
            the account is overdrawn.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance
      - created_at
      - holder_name
      - id
      - status
      - updated_at
    AccountRequest:
      type: object
      description: An account as the API returns it, and the body for creating one.
      properties:
        account_number:
          type: string
          description: Unique, and can't change after create. Generated (10 random
            digits) when left blank.
          maxLength: 32
        holder_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - holder_name
    AccountStatusEnum:
      enum:
      - OPEN
      - CLOSED
      type: string
    Error:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorTypeEnum'
        message:
          type: string
        detail:
          type: string
          description: Extra context, when there is any.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Validation errors only: messages for each invalid field (`non_field_errors`
            for the rest).'
      required:
      - message
      - type
    ErrorResponse:
      type: object
      description: The body of every error response (see `core.exceptions.api_exception_handler`).
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    ErrorTypeEnum:
      enum:
      - VALIDATION_ERROR
      - NOT_FOUND
      - METHOD_NOT_ALLOWED
      - CONFLICT
      - UNSUPPORTED_MEDIA_TYPE
      - REQUEST_ERROR
      - INTERNAL_ERROR
      type: string
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      type: string
    PaginatedAccountList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    PaginatedTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    PatchedAccountUpdateRequest:
      type: object
      description: The editable fields of an account. `account_number` can't change
        after create.
      properties:
        holder_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        status:
          $ref: '#/components/schemas/AccountStatusEnum'
    Transaction:
      type: object
      description: A transaction as the API returns it, and the body for posting one
        (the account comes from the URL).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        account:
          type: string
          format: uuid
          readOnly: true
        direction:
          $ref: '#/components/schemas/TransactionDirectionEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Always positive, at most 2 decimal places; the sign comes from
            `direction`.
        transaction_date:
          type: string
          format: date
        reference_id:
          type: string
          description: The source system's ID, unique per account, so reposting is
            idempotent. Generated ("TXN-" and 8 letters or digits) when left blank.
          maxLength: 64
        description:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account
      - amount
      - created_at
      - direction
      - id
      - transaction_date
    TransactionDirectionEnum:
      enum:
      - DEBIT
      - CREDIT
      type: string
    TransactionRequest:
      type: object
      description: A transaction as the API returns it, and the body for posting one
        (the account comes from the URL).
      properties:
        direction:
          $ref: '#/components/schemas/TransactionDirectionEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Always positive, at most 2 decimal places; the sign comes from
            `direction`.
        transaction_date:
          type: string
          format: date
        reference_id:
          type: string
          description: The source system's ID, unique per account, so reposting is
            idempotent. Generated ("TXN-" and 8 letters or digits) when left blank.
          maxLength: 64
        description:
          type: string
          maxLength: 255
      required:
      - amount
      - direction
      - transaction_date
