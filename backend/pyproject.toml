[project]
name = "ledger-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "django-migration-linter>=6.0.0",
    "factory-boy>=3.3.3",
    "faker>=40.43.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "DJ", "SIM", "C4", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["."]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "*/migrations/*", "*/tests/*", "manage.py", "config/wsgi.py"]

[tool.coverage.report]
skip_empty = true
